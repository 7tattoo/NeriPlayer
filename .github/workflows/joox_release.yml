name: Joox Car Release (v8a)

# 自定义 release：仅构建 arm64-v8a，支持未签名（allowUnsignedRelease），
# 产物上传为 artifact，供本地下载安装。

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: Branch, tag, or commit SHA to release
        required: true
        default: master
        type: string

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build signed Release APK (v8a) if keystore present
        id: signed
        if: ${{ secrets.KEYSTORE_B64 != '' && secrets.KEYSTORE_PASSWORD != '' && secrets.KEY_PASSWORD != '' }}
        run: |
          mkdir -p app
          echo "$KEYSTORE_B64" | base64 -d > app/neri.jks
          ./gradlew :app:assembleRelease \
            -PKEYSTORE_FILE=neri.jks \
            -PKEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PKEY_ALIAS=key0 \
            -PKEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            --warning-mode all --stacktrace
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}

      - name: Build unsigned Release APK (v8a)
        if: steps.signed.outcome != 'success'
        run: |
          ./gradlew :app:assembleRelease -PallowUnsignedRelease=true \
            --warning-mode all --stacktrace

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: joox-car-apk
          path: app/build/outputs/apk/release/**/*.apk
          if-no-files-found: error
